    <text x="24" y="295" font-family="'JetBrains Mono', monospace" font-size="11" fill="#93c5fd">║ #EVT-101 ║ AI Innovation Sprint 2026   ║ 128 Teams    ║ ● ACTIVE LIVE    ║</text>
    <text x="24" y="315" font-family="'JetBrains Mono', monospace" font-size="11" fill="#93c5fd">║ #EVT-102 ║ National Algo Challenge     ║ 84 Teams     ║ ● REGISTRATION   ║</text>
    <text x="24" y="335" font-family="'JetBrains Mono', monospace" font-size="11" fill="#93c5fd">║ #EVT-103 ║ Cloud Architecture Wars     ║ 62 Teams     ║ ○ COMPLETED      ║</text>
