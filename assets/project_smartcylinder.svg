<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#05070c"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131b2e" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0e1424" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="960" height="600" fill="url(#bgGrad)"/>
  <rect width="960" height="600" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Top Navigation Bar -->
  <rect width="960" height="54" fill="#0c1220" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <circle cx="28" cy="27" r="6" fill="#ef4444"/>
  <circle cx="48" cy="27" r="6" fill="#f59e0b"/>
  <circle cx="68" cy="27" r="6" fill="#10b981"/>

  <text x="96" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#93c5fd">SmartCylinder</text>
  <text x="195" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">/ Gas Delivery &amp; Dispatch Console</text>

  <!-- Server Status Badge -->
  <rect x="740" y="14" width="130" height="26" rx="13" fill="rgba(16,185,129,0.12)" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
  <circle cx="754" cy="27" r="4" fill="#10b981"/>
  <text x="765" y="31" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="500" fill="#10b981">PostgreSQL Live</text>

  <rect x="885" y="14" width="55" height="26" rx="6" fill="rgba(255,255,255,0.08)"/>
  <text x="898" y="31" font-family="sans-serif" font-size="11" fill="#cbd5e1">Admin</text>

  <!-- Sidebar -->
  <rect x="0" y="54" width="180" height="546" fill="#080c16" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  
  <!-- Sidebar Menu Items -->
  <rect x="12" y="74" width="156" height="34" rx="6" fill="rgba(59,130,246,0.15)" stroke="rgba(59,130,246,0.3)" stroke-width="1"/>
  <text x="28" y="96" font-family="sans-serif" font-size="12" font-weight="600" fill="#60a5fa">📊 Overview</text>
  
  <text x="28" y="138" font-family="sans-serif" font-size="12" fill="#94a3b8">🚚 Live Tracking</text>
  <text x="28" y="174" font-family="sans-serif" font-size="12" fill="#94a3b8">📦 Orders (142)</text>
  <text x="28" y="210" font-family="sans-serif" font-size="12" fill="#94a3b8">👥 Customers</text>
  <text x="28" y="246" font-family="sans-serif" font-size="12" fill="#94a3b8">📈 Analytics</text>
  <text x="28" y="282" font-family="sans-serif" font-size="12" fill="#94a3b8">⚙️ Settings</text>

  <!-- Main Content Area -->
  <!-- 4 Stat Cards -->
  <g transform="translate(200, 74)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="170" height="85" rx="8" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)"/>
    <text x="16" y="26" font-family="sans-serif" font-size="11" fill="#94a3b8">Active Bookings</text>
    <text x="16" y="58" font-family="sans-serif" font-size="22" font-weight="700" fill="#ffffff">1,428</text>
    <text x="16" y="74" font-family="sans-serif" font-size="10" fill="#10b981">↑ +18.4% today</text>

    <!-- Card 2 -->
    <rect x="185" y="0" width="170" height="85" rx="8" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)"/>
    <text x="201" y="26" font-family="sans-serif" font-size="11" fill="#94a3b8">Delivery Efficiency</text>
    <text x="201" y="58" font-family="sans-serif" font-size="22" font-weight="700" fill="#38bdf8">98.4%</text>
    <text x="201" y="74" font-family="sans-serif" font-size="10" fill="#38bdf8">Avg 32 mins / drop</text>

    <!-- Card 3 -->
    <rect x="370" y="0" width="170" height="85" rx="8" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)"/>
    <text x="386" y="26" font-family="sans-serif" font-size="11" fill="#94a3b8">Stock Level</text>
    <text x="386" y="58" font-family="sans-serif" font-size="22" font-weight="700" fill="#a78bfa">4,850</text>
    <text x="386" y="74" font-family="sans-serif" font-size="10" fill="#a78bfa">Cylinders Available</text>

    <!-- Card 4 -->
    <rect x="555" y="0" width="175" height="85" rx="8" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)"/>
    <text x="571" y="26" font-family="sans-serif" font-size="11" fill="#94a3b8">Dispatch Vehicles</text>
    <text x="571" y="58" font-family="sans-serif" font-size="22" font-weight="700" fill="#34d399">24 / 24</text>
    <text x="571" y="74" font-family="sans-serif" font-size="10" fill="#34d399">● All units deployed</text>
  </g>

  <!-- Map / Dispatch Simulator Section -->
  <g transform="translate(200, 175)">
    <rect x="0" y="0" width="440" height="215" rx="10" fill="#0d1424" stroke="rgba(255,255,255,0.08)"/>
    <text x="18" y="28" font-family="sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Live Route &amp; Cylinder Tracking</text>
    
    <!-- Grid Map Simulation -->
    <path d="M 30 70 Q 120 120, 220 80 T 400 130" stroke="#3b82f6" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 50 160 Q 180 90, 290 170 T 390 80" stroke="#06b6d4" stroke-width="2" stroke-dasharray="6,4" fill="none"/>

    <!-- Map Nodes / Pins -->
    <circle cx="120" cy="98" r="7" fill="#3b82f6"/>
    <circle cx="120" cy="98" r="14" fill="rgba(59,130,246,0.2)"/>
    <text x="100" y="80" font-family="sans-serif" font-size="10" fill="#93c5fd">Truck #08 (Active)</text>

    <circle cx="280" cy="115" r="7" fill="#10b981"/>
    <circle cx="280" cy="115" r="14" fill="rgba(16,185,129,0.2)"/>
    <text x="260" y="142" font-family="sans-serif" font-size="10" fill="#6ee7b7">Hub #02 (Central)</text>

    <circle cx="380" cy="125" r="7" fill="#f59e0b"/>
    <text x="350" y="110" font-family="sans-serif" font-size="10" fill="#fde68a">Delivery Point B</text>
  </g>

  <!-- Recent Bookings Table Preview -->
  <g transform="translate(655, 175)">
    <rect x="0" y="0" width="275" height="215" rx="10" fill="#0d1424" stroke="rgba(255,255,255,0.08)"/>
    <text x="16" y="28" font-family="sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Recent Bookings</text>

    <!-- Row 1 -->
    <rect x="12" y="45" width="250" height="36" rx="6" fill="rgba(255,255,255,0.03)"/>
    <text x="22" y="66" font-family="monospace" font-size="11" fill="#94a3b8">#BK-9021</text>
    <rect x="180" y="53" width="72" height="20" rx="4" fill="rgba(16,185,129,0.15)"/>
    <text x="190" y="67" font-family="sans-serif" font-size="10" fill="#34d399">Delivered</text>

    <!-- Row 2 -->
    <rect x="12" y="88" width="250" height="36" rx="6" fill="rgba(255,255,255,0.03)"/>
    <text x="22" y="109" font-family="monospace" font-size="11" fill="#94a3b8">#BK-9022</text>
    <rect x="180" y="96" width="72" height="20" rx="4" fill="rgba(59,130,246,0.15)"/>
    <text x="188" y="110" font-family="sans-serif" font-size="10" fill="#60a5fa">On Route</text>

    <!-- Row 3 -->
    <rect x="12" y="131" width="250" height="36" rx="6" fill="rgba(255,255,255,0.03)"/>
    <text x="22" y="152" font-family="monospace" font-size="11" fill="#94a3b8">#BK-9023</text>
    <rect x="180" y="139" width="72" height="20" rx="4" fill="rgba(245,158,11,0.15)"/>
    <text x="191" y="153" font-family="sans-serif" font-size="10" fill="#fbbf24">Pending</text>

    <!-- Row 4 -->
    <rect x="12" y="174" width="250" height="32" rx="6" fill="rgba(255,255,255,0.03)"/>
    <text x="22" y="195" font-family="monospace" font-size="11" fill="#94a3b8">#BK-9024</text>
    <rect x="180" y="180" width="72" height="20" rx="4" fill="rgba(16,185,129,0.15)"/>
    <text x="190" y="194" font-family="sans-serif" font-size="10" fill="#34d399">Delivered</text>
  </g>

  <!-- Bottom Code & Stack Strip -->
  <g transform="translate(200, 405)">
    <rect x="0" y="0" width="730" height="175" rx="10" fill="#0b101c" stroke="rgba(255,255,255,0.08)"/>
    <text x="20" y="28" font-family="sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Django Backend Architecture &amp; Role-Based Logic</text>

    <!-- Code Block -->
    <rect x="16" y="42" width="698" height="118" rx="6" fill="#060911" stroke="rgba(255,255,255,0.05)"/>
    <text x="32" y="68" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#c084fc">class <tspan fill="#60a5fa">OrderDispatcher</tspan>(models.Model):</text>
    <text x="52" y="88" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#94a3b8">customer = models.ForeignKey(User, on_delete=models.CASCADE)</text>
    <text x="52" y="106" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#94a3b8">delivery_status = models.CharField(max_length=20, default=<tspan fill="#34d399">'IN_TRANSIT'</tspan>)</text>
    <text x="52" y="124" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#94a3b8">def <tspan fill="#f59e0b">calculate_efficiency_score</tspan>(self): return round(self.duration / 30.0, 2)</text>
    <text x="52" y="142" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#38bdf8"># Automated customer SMS alerts + PostgreSQL booking history analytics</text>
  </g>
</svg>